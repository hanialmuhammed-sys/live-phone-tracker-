<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby — Phone GPS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0f1115;
            --surface: #181b22;
            --border: #2a2f3a;
            --text: #e8eaf0;
            --text-muted: #9aa3b5;
            --accent: #6ee7b7;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .brand__mark {
            color: var(--accent);
            font-size: 1.3rem;
            font-family: 'IBM Plex Mono', monospace;
        }

        .brand__name {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            font-size: 1.4rem;
        }

        h2 {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 500;
            font-size: 1.35rem;
            margin-bottom: 1.25rem;
        }

        #status {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <span class="brand__mark">●</span>
            <span class="brand__name">Nearby</span>
        </div>

        <h2>Phone GPS Tracker</h2>
        <p id="status">Waiting...</p>
    </div>

    <script>
        function sendLocation() {
            navigator.geolocation.getCurrentPosition(async (position) => {
                const data = {
                    lat: position.coords.latitude,
                    lon: position.coords.longitude
                };

                document.getElementById("status").innerHTML =
                    "Latitude: " + data.lat +
                    "<br>Longitude: " + data.lon;

                await fetch("/location", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });
            });
        }

        sendLocation();
        setInterval(sendLocation, 5000);
    </script>
</body>
</html>
