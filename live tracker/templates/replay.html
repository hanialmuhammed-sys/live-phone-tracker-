<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby — Route Replay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        :root {
            --bg: #0f1115;
            --surface: #181b22;
            --border: #2a2f3a;
            --text: #e8eaf0;
            --text-muted: #9aa3b5;
            --accent: #6ee7b7;
            --accent-hover: #34d399;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
        }

        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar__header {
            padding: 1.25rem 1.25rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .brand { display: flex; align-items: center; gap: 0.55rem; }
        .brand__mark { color: var(--accent); font-size: 1.25rem; font-family: 'IBM Plex Mono', monospace; }
        .brand__name { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.35rem; }

        .app-nav {
            display: flex;
            flex-direction: column;
            padding: 0.75rem;
            gap: 0.25rem;
            border-bottom: 1px solid var(--border);
        }
        .app-nav__link {
            padding: 0.55rem 0.85rem;
            border-radius: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .app-nav__link:hover { background: rgba(110, 231, 183, 0.08); color: var(--text); }
        .app-nav__link--active {
            background: rgba(110, 231, 183, 0.12);
            color: var(--accent);
        }

        .replay__controls {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            border-bottom: 1px solid var(--border);
        }

        .replay__controls label {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: -0.4rem;
        }

        .replay__controls input[type="date"],
        .replay__controls select,
        .replay__controls input[type="range"] {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
        }

        .replay__load {
            padding: 0.65rem;
            background: var(--accent);
            color: #0f1115;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .replay__load:hover { background: var(--accent-hover); }

        .replay__buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.4rem;
        }
        .replay__btn {
            padding: 0.55rem 0.4rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
        }
        .replay__btn:hover { border-color: var(--accent); color: var(--accent); }

        .replay__current-time {
            text-align: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.95rem;
            color: var(--accent);
            padding: 0.4rem;
        }

        .replay__stats {
            padding: 1.25rem;
            flex: 1;
        }
        .replay__stats-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.85rem;
        }
        .replay__stat {
            display: flex;
            justify-content: space-between;
            padding: 0.55rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .replay__stat span { color: var(--text-muted); }
        .replay__stat strong { color: var(--accent); font-weight: 600; }

        .map-pane { position: relative; height: 100%; }
        #replay-map { width: 100%; height: 100%; background: #111; }

        @media (max-width: 800px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { max-height: 45vh; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar: controls + stats -->
        <aside class="sidebar">
            <header class="sidebar__header">
                <div class="brand">
                    <span class="brand__mark">&#9679;</span>
                    <h1 class="brand__name">Nearby</h1>
                </div>
            </header>

            <nav class="app-nav">
                <a href="{{ url_for('dashboard.dashboard') }}" class="app-nav__link">Dashboard</a>
                <a href="{{ url_for('analytics.analytics_page') }}" class="app-nav__link">Analytics</a>
                <a href="{{ url_for('replay.replay_page') }}" class="app-nav__link app-nav__link--active">Replay</a>
            </nav>

            <div class="replay__controls">
                <label for="replay-date">📅 Select Date</label>
                <input type="date" id="replay-date">
                <button type="button" id="load-replay" class="replay__load">Load</button>

                <div class="replay__buttons">
                    <button type="button" id="play-button" class="replay__btn">▶ Play</button>
                    <button type="button" id="pause-button" class="replay__btn">⏸ Pause</button>
                    <button type="button" id="stop-button" class="replay__btn">⏹ Stop</button>
                </div>

                <label for="speed">Speed</label>
                <select id="speed">
                    <option value="1000">1x</option>
                    <option value="500">2x</option>
                    <option value="200">5x</option>
                </select>

                <label for="timeline">Timeline</label>
                <input type="range" id="timeline" min="0" max="0" value="0">

                <p class="replay__current-time" id="current-time">&mdash;</p>
            </div>

            <div class="replay__stats">
                <p class="replay__stats-title">Statistics</p>
                <div class="replay__stat">
                    <span>Distance</span>
                    <strong id="stat-distance">&mdash;</strong>
                </div>
                <div class="replay__stat">
                    <span>Stops</span>
                    <strong id="stat-stops">&mdash;</strong>
                </div>
                <div class="replay__stat">
                    <span>Duration</span>
                    <strong id="stat-duration">&mdash;</strong>
                </div>
                <div class="replay__stat">
                    <span>Average Speed</span>
                    <strong id="stat-speed">&mdash;</strong>
                </div>
            </div>
        </aside>

        <!-- Map -->
        <main class="map-pane">
            <div id="replay-map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map("replay-map", { zoomControl: true }).setView([37.7749, -122.4194], 12);

        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_matter/{z}/{x}/{y}{r}.png", {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: "abcd",
            maxZoom: 19,
        }).addTo(map);

        let replayMarker = L.marker([0, 0]).addTo(map);
        let replayPolyline = null;

        let replayData = [];
        let replayIndex = 0;
        let playing = false;

        const dateInput = document.getElementById("replay-date");
        const timeline = document.getElementById("timeline");
        const speedSelect = document.getElementById("speed");
        const currentTimeEl = document.getElementById("current-time");

        dateInput.value = new Date().toISOString().slice(0, 10);

        async function loadReplay() {
            const date = dateInput.value;
            if (!date) return;

            stop();

            const response = await fetch("/replay/" + date);
            replayData = await response.json();

            if (replayPolyline) {
                map.removeLayer(replayPolyline);
                replayPolyline = null;
            }

            if (replayData.length === 0) {
                currentTimeEl.textContent = "No location history for this day";
                timeline.max = 0;
                resetStats();
                return;
            }

            const points = replayData.map(p => [p.lat, p.lon]);
            replayPolyline = L.polyline(points, { color: "#6ee7b7", weight: 5 }).addTo(map);
            map.fitBounds(replayPolyline.getBounds(), { padding: [30, 30] });

            timeline.max = replayData.length - 1;
            timeline.value = 0;
            replayIndex = 0;

            updateMarker(0);
            loadStats(date);
        }

        function updateMarker(index) {
            if (!replayData[index]) return;
            replayMarker.setLatLng([replayData[index].lat, replayData[index].lon]);
            currentTimeEl.textContent = replayData[index].time;
            timeline.value = index;
        }

        function playReplay() {
            if (!playing) return;

            if (replayIndex >= replayData.length) {
                playing = false;
                return;
            }

            updateMarker(replayIndex);
            replayIndex++;

            const speed = Number(speedSelect.value);
            setTimeout(playReplay, speed);
        }

        function play() {
            if (replayData.length === 0) return;
            if (replayIndex >= replayData.length) replayIndex = 0;
            playing = true;
            playReplay();
        }

        function pause() {
            playing = false;
        }

        function stop() {
            playing = false;
            replayIndex = 0;
            if (replayData.length > 0) updateMarker(0);
        }

        timeline.addEventListener("input", function () {
            replayIndex = Number(this.value);
            updateMarker(replayIndex);
        });

        document.getElementById("play-button").addEventListener("click", play);
        document.getElementById("pause-button").addEventListener("click", pause);
        document.getElementById("stop-button").addEventListener("click", stop);
        document.getElementById("load-replay").addEventListener("click", loadReplay);

        function formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.round((seconds % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function resetStats() {
            document.getElementById("stat-distance").textContent = "—";
            document.getElementById("stat-stops").textContent = "—";
            document.getElementById("stat-duration").textContent = "—";
            document.getElementById("stat-speed").textContent = "—";
        }

        async function loadStats(date) {
            try {
                const response = await fetch("/replay/" + date + "/stats");
                const stats = await response.json();

                document.getElementById("stat-distance").textContent = stats.distance + " km";
                document.getElementById("stat-stops").textContent = stats.stops;
                document.getElementById("stat-duration").textContent = formatDuration(stats.duration_seconds);
                document.getElementById("stat-speed").textContent = stats.average_speed + " km/h";
            } catch (error) {
                console.error(error);
            }
        }

        loadReplay();
    </script>
</body>
</html>
